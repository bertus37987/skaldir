name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mcp]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests (pytest)
        # `python -m pytest tests/ -q` — the invocation that adds the repo root to sys.path
        # (a bare `pytest` console script does not, so `from tests.<mod> import …` in the
        # collected modules raised ModuleNotFoundError and aborted collection). Matches the
        # milestone gate in services.yaml.
        run: python -m pytest tests/ -q
      - name: Security scan (bandit)
        run: bandit -q -r src -ll
